name: Agentic PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  notify-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Agent Webhook
        run: |
          # AGENT_URL must be a public URL that GitHub can reach. 
          # E.g., https://your-render-app.onrender.com or an ngrok tunnel url.
          # We pass this as a repository secret.
          if [ -z "${{ secrets.AGENT_URL }}" ]; then
            echo "Error: AGENT_URL secret is not set in GitHub repository secrets."
            exit 1
          fi
          
          curl -X POST "${{ secrets.AGENT_URL }}/webhook/pr" \
               -H "Content-Type: application/json" \
               -d "{\"pr_number\": ${{ github.event.pull_request.number }}}"
