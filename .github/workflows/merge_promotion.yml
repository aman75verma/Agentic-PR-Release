name: Build and Promote Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./demo-app
          push: true
          # We tag the image with the specific git commit SHA
          tags: ${{ secrets.DOCKER_USERNAME }}/taskapi-demo:${{ github.sha }}, ${{ secrets.DOCKER_USERNAME }}/taskapi-demo:latest

      - name: Call promotion agent webhook
        run: |
          if [ -z "${{ secrets.AGENT_URL }}" ]; then
            echo "Error: AGENT_URL secret is not set in GitHub repository secrets."
            exit 1
          fi

          curl -X POST "${{ secrets.AGENT_URL }}/webhook/merge" \
               -H "Content-Type: application/json" \
               -d "{\"image_tag\": \"${{ github.sha }}\"}"
