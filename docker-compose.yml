version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taskapi-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auditlog
    ports:
      - "5433:5432"
    volumes:
      - ./backend/db/schema_pg.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  taskapi-dev:
    build: 
      context: ./demo-app
    image: taskapi-demo:latest
    container_name: taskapi-dev
    ports:
      - "8081:8080"
    environment:
      - INJECT_BUG=false
      - ENV_NAME=dev
      - IMAGE_TAG=latest
    restart: unless-stopped

  taskapi-staging:
    build: 
      context: ./demo-app
    image: taskapi-demo:latest
    container_name: taskapi-staging
    ports:
      - "8082:8080"
    environment:
      - INJECT_BUG=false
      - ENV_NAME=staging
      - IMAGE_TAG=latest
    restart: unless-stopped

  taskapi-prod:
    build: 
      context: ./demo-app
    image: taskapi-demo:latest
    container_name: taskapi-prod
    ports:
      - "8083:8080"
    environment:
      - INJECT_BUG=false
      - ENV_NAME=prod
      - IMAGE_TAG=latest
    restart: unless-stopped
